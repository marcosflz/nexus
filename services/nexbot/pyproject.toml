[project]
name = "nexus-nexbot"
version = "0.1.0"
description = "Runtime que corre dentro del contenedor de cada NexBot: tareas, navegador y workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.133,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.12,<3",
  "playwright==1.64.1",
  # La misma rama que el cliente MCP del sidecar (nas-adk).
  "mcp>=1.30,<2",
  # Captura de la pantalla virtual para el visor.
  "mss>=10,<11",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=0.25", "httpx>=0.27,<1", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexbot"]
