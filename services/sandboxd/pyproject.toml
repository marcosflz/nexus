[project]
name = "nexus-sandboxd"
version = "0.1.0"
description = "Gestiona el contenedor aislado (navegador + espacio de trabajo) de cada agente de Nexus"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.133,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=0.25", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandboxd"]
