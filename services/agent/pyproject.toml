[project]
name = "nexus-agent"
version = "0.1.0"
description = "Sidecar de agentes de Nexus: nas-adk detrás de una API SSE (AG-UI)"
requires-python = ">=3.12"
dependencies = [
  # 0.5.0: Agent Skills, checkpoints con estado y creador reutilizable.
  "nas-adk[anthropic]>=0.5.0",
  "fastapi>=0.133,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=0.25", "ruff>=0.8"]

[tool.uv.sources]
# nas-adk vive en su propio repositorio (hermano de este). En Docker se monta
# como contexto adicional; ver docker/agent.Dockerfile.
nas-adk = { path = "../../../nas-adk" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_agent"]
