name: nexus

services:
  app:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: nexus-app
    init: true
    restart: unless-stopped
    # Margen para que Next termine los turnos en curso antes de que Docker lo mate.
    stop_grace_period: 30s
    command: ["sh", "/app/docker/start-web.sh"]
    ports:
      # Puerto del host configurable: APP_PORT=3010 docker compose up -d
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://plexo:plexo@db:5432/plexo
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      # Motor de agentes (sidecar nas-adk): URL, secreto compartido y URL con la que
      # el sidecar vuelve a llamar al BFF (red interna de Compose).
      NEXUS_AGENT_URL: http://agent:8090
      NEXUS_AGENT_SECRET: ${NEXUS_AGENT_SECRET}
      NEXUS_AGENT_CONTEXT_TOKENS: ${NEXUS_AGENT_CONTEXT_TOKENS:-64000}
      NEXUS_INTERNAL_URL: http://app:3000
      # Correos (separados por comas) que reciben ese rol en cada arranque.
      NEXUS_SUPERADMIN_EMAILS: ${NEXUS_SUPERADMIN_EMAILS:-}
      NEXUS_ADMIN_EMAILS: ${NEXUS_ADMIN_EMAILS:-}
      # Solo si se despliega el perfil «computer»: gestor de los navegadores de los agentes.
      NEXUS_SANDBOXD_URL: ${NEXUS_SANDBOXD_URL:-}
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy

  # Sidecar de agentes (nas-adk). nas-adk vive en su propio repositorio: se aporta
  # como contexto adicional (por defecto el directorio hermano ../nas-adk).
  agent:
    build:
      context: ./services/agent
      dockerfile: ../../docker/agent.Dockerfile
      additional_contexts:
        nas-adk: ${NAS_ADK_PATH:-../nas-adk}
    container_name: nexus-agent
    init: true
    restart: unless-stopped
    environment:
      NEXUS_AGENT_SECRET: ${NEXUS_AGENT_SECRET:?define NEXUS_AGENT_SECRET en .env (openssl rand -hex 32)}
      SEARXNG_URL: http://searxng:8080
      # Proveedor «Claude Code (suscripción)». Cada usuario vincula su propia cuenta de
      # Anthropic desde la web: aquí no va ningún token (CLAUDE_CODE_OAUTH_TOKEN se ignora).
      # No añadas variables ANTHROPIC_*: nas-adk se niega a arrancar el CLI para no facturar
      # por API sin querer.
      CLAUDE_CODE_MAX_CONCURRENCY: ${CLAUDE_CODE_MAX_CONCURRENCY:-2}
      CLAUDE_CODE_TIMEOUT: ${CLAUDE_CODE_TIMEOUT:-300}
    # Además de la red interna, el sidecar llega a los navegadores de los agentes (perfil «computer»).
    networks: [default, sandbox]
    # Solo accesible desde la red interna: el BFF es su único cliente.
    expose:
      - "8090"
    depends_on:
      searxng:
        condition: service_started

  # --- Ordenador de los agentes (opcional) -----------------------------------
  # Activar con:  docker compose --profile computer up -d
  # Un contenedor aislado (navegador) por agente. `sandboxd` no toca el socket de
  # Docker: habla con un proxy que solo permite las rutas de contenedores y volúmenes.

  docker-proxy:
    profiles: ["computer"]
    image: tecnativa/docker-socket-proxy:latest
    container_name: nexus-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      VOLUMES: 1
      # Cada NexBot tiene su propia red interna.
      NETWORKS: 1
      POST: 1
      DELETE: 1
      # Todo lo demás (imágenes, exec, servicios, swarm…) queda denegado.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [sandboxd]

  sandboxd:
    profiles: ["computer"]
    build:
      context: ./services/sandboxd
      dockerfile: ../../docker/sandboxd.Dockerfile
    container_name: nexus-sandboxd
    restart: unless-stopped
    environment:
      NEXUS_AGENT_SECRET: ${NEXUS_AGENT_SECRET:?define NEXUS_AGENT_SECRET en .env}
      DOCKER_HOST: http://docker-proxy:2375
      SANDBOX_NETWORK: nexus-sandbox
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-mcr.microsoft.com/playwright/mcp:latest}
      # NexBots: imagen del runtime y servicios que se conectan a la red de cada bot.
      BOT_IMAGE: ${BOT_IMAGE:-nexus-nexbot:latest}
      BOT_EGRESS_CONTAINER: nexus-bot-egress
      BOT_CONTROL_CONTAINERS: nexus-sandboxd,nexus-agent
    depends_on: [docker-proxy, bot-egress]
    networks: [default, sandboxd]
    expose: ["8095"]

  # Única salida a internet de los NexBots. Rechaza los destinos privados tras resolver
  # el DNS. No tiene acceso a Docker ni a ningún secreto.
  bot-egress:
    profiles: ["computer"]
    build:
      context: ./services/sandboxd
      dockerfile: ../../docker/sandboxd.Dockerfile
    container_name: nexus-bot-egress
    restart: unless-stopped
    command: ["python", "-m", "sandboxd.egress"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [egress]

  # Solo construye la imagen del runtime: los contenedores de los bots los crea sandboxd.
  nexbot-image:
    profiles: ["build-only"]
    build:
      context: ./services/nexbot
      dockerfile: ../../docker/nexbot.Dockerfile
    image: nexus-nexbot:latest

  db:
    image: postgres:18-alpine
    container_name: nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plexo
      POSTGRES_PASSWORD: plexo
      POSTGRES_DB: plexo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18+ espera el volumen en /var/lib/postgresql (no .../data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexo -d plexo"]
      interval: 5s
      timeout: 5s
      retries: 20

  searxng:
    image: searxng/searxng:latest
    container_name: nexus-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw

networks:
  # Los navegadores de los agentes viven aquí, separados de la base de datos y de la app.
  sandbox:
    name: nexus-sandbox
  sandboxd:
    internal: true
  # Salida a internet del proxy de los NexBots, separada del resto de servicios.
  egress:
    name: nexus-bot-egress-net

volumes:
  # Los nombres se fijan a los que se crearon cuando el proyecto se llamaba
  # "plexo": sin esto, `name: nexus` crearía volúmenes vacíos (nexus_*) y los
  # usuarios e hilos existentes parecerían perdidos. El volumen `plexo_hermes-data`
  # del motor retirado ya no se usa; puede borrarse a mano.
  db-data:
    name: plexo_db-data
